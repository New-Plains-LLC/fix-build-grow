<form class="lead-form" action="{{ .Site.Params.leadWebhook }}" method="POST" style="max-width:560px;margin:2rem 0;">
  <input type="hidden" name="source" value="{{ .Site.Params.leadSource }}">
  <input type="hidden" name="service" value="Foundation Repair">
  <input type="hidden" name="city" value="{{ .Site.Params.city }}">
  <div class="lead-form-row">
    <input type="text" name="name" required placeholder="Your name">
    <input type="tel" name="phone" required placeholder="Phone number">
  </div>
  <input type="email" name="email" placeholder="Email (optional)">
  <select name="issue" required>
    <option value="">What issue are you having?</option>
    <option value="cracks">Foundation cracks</option>
    <option value="settling">Foundation settling / sinking</option>
    <option value="pier-beam">Pier and beam issues</option>
    <option value="drainage">Drainage problems</option>
    <option value="waterproofing">Crawlspace / basement water</option>
    <option value="other">Not sure / other</option>
  </select>
  <textarea name="problem" rows="4" placeholder="Describe the problem in detail..."></textarea>
  <div class="consent-row">
    <input type="checkbox" name="consent" value="yes" required id="consent-contact">
    <label for="consent-contact">I consent to being contacted about this request.</label>
  </div>
  <button type="submit" class="button accent" style="width:100%;text-align:center;padding:1rem;">Send Request →</button>
</form>
