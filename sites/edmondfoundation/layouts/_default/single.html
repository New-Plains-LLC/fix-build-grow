{{ define "main" }}
<section class="service-detail">
  <div class="container service-detail-layout">
    <article class="service-detail-content">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
    </article>
    <aside class="service-detail-sidebar">
      <div class="card">
        <h3>Need Foundation Repair in {{ site.Params.city }}?</h3>
        <p style="color:var(--muted);font-size:.95rem;margin:0 0 1.25rem;">Describe your issue and we'll get you a free estimate.</p>
        <form action="{{ site.Params.leadWebhook }}" method="POST" style="display:grid;gap:.75rem;">
          <input type="hidden" name="source" value="{{ site.Params.leadSource }}">
          <input type="hidden" name="service" value="{{ .Title }}">
          <input type="hidden" name="city" value="{{ site.Params.city }}">
          <input type="text" name="name" required placeholder="Your name" style="width:100%;padding:.75rem;border:1px solid var(--border);border-radius:var(--radius);font:inherit;">
          <input type="tel" name="phone" required placeholder="Phone" style="width:100%;padding:.75rem;border:1px solid var(--border);border-radius:var(--radius);font:inherit;">
          <textarea name="problem" rows="3" placeholder="Describe the issue..." style="width:100%;padding:.75rem;border:1px solid var(--border);border-radius:var(--radius);font:inherit;resize:vertical;"></textarea>
          <button type="submit" class="button accent" style="width:100%;text-align:center;">Get Free Estimate →</button>
        </form>
      </div>
    </aside>
  </div>
</section>
{{ end }}
